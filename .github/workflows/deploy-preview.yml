name: FRYZAR Preview Deployment

# This workflow lives on main so GitHub can expose workflow_dispatch.
# Pin the reviewed candidate commit so deployment credentials are never exposed to unreviewed branch changes.
# Update this SHA only after the replacement candidate commit has passed CI and review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fryzar-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy and smoke-test isolated preview Workers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          ref: ed48f1b061f41b3b009138d8cdf98ea856779b43
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate preview-only credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRACKING_SECRET: ${{ secrets.TRACKING_SECRET }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "234b20e49261c7a002f63b129e985563" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or does not match the FRYZAR Cloudflare account."
            exit 1
          fi

          for secret_name in CLOUDFLARE_API_TOKEN TRACKING_SECRET OWNER_BOOTSTRAP_TOKEN; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required preview environment secret is missing: $secret_name"
              exit 1
            fi
          done

          if [[ "${#TRACKING_SECRET}" -lt 32 ]]; then
            echo "::error::TRACKING_SECRET must contain at least 32 characters."
            exit 1
          fi

          if [[ "${#OWNER_BOOTSTRAP_TOKEN}" -lt 32 ]]; then
            echo "::error::OWNER_BOOTSTRAP_TOKEN must contain at least 32 characters."
            exit 1
          fi

      - name: Install candidate dependencies
        working-directory: candidate
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Cloudflare authentication
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Verify deployment targets are preview-only
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail

          grep -Fqx 'name = "fryzar-api-preview"' apps/api/wrangler.toml
          grep -Fqx 'database_name = "fryzar-preview"' apps/api/wrangler.toml
          grep -Fqx 'database_id = "a6f528a3-4b36-43a9-8e77-31f7105a4aeb"' apps/api/wrangler.toml
          grep -Fqx 'name = "fryzar-app-preview"' apps/customer-worker/wrangler.toml
          grep -Fqx 'name = "fryzar-admin-preview"' apps/admin-worker/wrangler.toml
          grep -Fqx 'service = "fryzar-api-preview"' apps/customer-worker/wrangler.toml
          grep -Fqx 'service = "fryzar-api-preview"' apps/admin-worker/wrangler.toml

          if grep -Eq 'name = "fryzar-(app|admin|api)"|database_name = "fryzar-(production|core)"|database_id = "(880b9681-4252-4db0-be44-b60c4edbdc15|098238a6-1bda-4735-8f21-d925c7fe32de)"'             apps/api/wrangler.toml apps/customer-worker/wrangler.toml apps/admin-worker/wrangler.toml; then
            echo "::error::A production FRYZAR deployment target was detected. Aborting."
            exit 1
          fi

      - name: Run API, routing, checkout integration and frontend builds
        working-directory: candidate
        run: |
          npm test
          npm run test:integration:local
          npm run build:storefront
          npm run build:admin

      - name: Apply migrations to isolated preview D1 only
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:preview

      # First deployment creates the Worker so Wrangler can attach its initial secrets.
      - name: Bootstrap isolated central API Worker
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:api-preview

      - name: Provision preview-only API secrets
        working-directory: candidate
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRACKING_SECRET: ${{ secrets.TRACKING_SECRET }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TRACKING_SECRET" | npx wrangler secret put TRACKING_SECRET --config apps/api/wrangler.toml
          printf '%s' "$OWNER_BOOTSTRAP_TOKEN" | npx wrangler secret put OWNER_BOOTSTRAP_TOKEN --config apps/api/wrangler.toml

      # Secret updates create new Worker versions, so finish with a deployment of the reviewed source.
      - name: Deploy isolated central API Worker with secrets attached
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:api-preview

      - name: Deploy customer preview Worker
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config apps/customer-worker/wrangler.toml

      - name: Deploy admin preview Worker
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config apps/admin-worker/wrangler.toml

      - name: Smoke-test preview API, CORS, static apps and service bindings
        shell: bash
        env:
          API_BASE_URL: https://fryzar-api-preview.perfectlooparts786.workers.dev
          CUSTOMER_BASE_URL: https://fryzar-app-preview.perfectlooparts786.workers.dev
          ADMIN_BASE_URL: https://fryzar-admin-preview.perfectlooparts786.workers.dev
        run: |
          set -euo pipefail

          node <<'NODE'
          const assert = require("node:assert/strict");

          const api = process.env.API_BASE_URL;
          const customer = process.env.CUSTOMER_BASE_URL;
          const admin = process.env.ADMIN_BASE_URL;

          async function requestWithRetry(url, options = {}) {
            let lastError;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try {
                const response = await fetch(url, options);
                if (response.status < 500) return response;
                lastError = new Error(`HTTP ${response.status} from ${url}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError || new Error(`Request failed: ${url}`);
          }

          async function health(label, baseUrl, origin) {
            const headers = origin ? { Origin: origin } : {};
            const response = await requestWithRetry(`${baseUrl}/api/v1/health`, { headers });
            assert.equal(response.status, 200, `${label} health status`);
            const body = await response.json();
            assert.equal(body.ok, true, `${label} API health`);
            assert.equal(body.schema, "ready", `${label} D1 schema`);
            if (origin) {
              assert.equal(
                response.headers.get("access-control-allow-origin"),
                origin,
                `${label} exact CORS origin`
              );
            }
          }

          async function appShell(label, baseUrl) {
            const response = await requestWithRetry(`${baseUrl}/`);
            assert.equal(response.status, 200, `${label} home page status`);
            const html = await response.text();
            assert.ok(html.includes('id="root"'), `${label} React application shell`);
          }

          (async () => {
            await health("Direct API", api);
            await health("Customer service binding", customer, customer);
            await health("Admin service binding", admin, admin);

            const productsResponse = await requestWithRetry(`${customer}/api/v1/products`, {
              headers: { Origin: customer }
            });
            assert.equal(productsResponse.status, 200, "Customer catalogue route");
            const productsBody = await productsResponse.json();
            assert.ok(Array.isArray(productsBody.products), "Customer catalogue payload");
            assert.equal(productsBody.products.length, 0, "Preview catalogue starts empty");

            const categoriesResponse = await requestWithRetry(`${customer}/api/v1/categories`, {
              headers: { Origin: customer }
            });
            assert.equal(categoriesResponse.status, 200, "Customer categories route");
            const categoriesBody = await categoriesResponse.json();
            assert.ok(Array.isArray(categoriesBody.categories), "Customer categories payload");
            assert.equal(categoriesBody.categories.length, 0, "Preview categories start empty");

            const settingsResponse = await requestWithRetry(`${customer}/api/v1/storefront-config`, {
              headers: { Origin: customer }
            });
            assert.equal(settingsResponse.status, 200, "Public storefront settings route");
            const settingsBody = await settingsResponse.json();
            assert.equal(settingsBody.settings.store_status, "setup", "Preview store remains in setup");
            assert.equal(settingsBody.settings.launch_ready, false, "Preview ordering remains closed");
            assert.equal(settingsBody.settings.manual_transfer_enabled, false, "Manual transfer remains disabled");
            assert.equal(settingsBody.settings.currency, "PKR", "Preview currency");
 
            const checkoutResponse = await requestWithRetry(`${customer}/api/v1/orders`, {
              method: "POST",
              headers: {
                Origin: customer,
                "Content-Type": "application/json",
                "Idempotency-Key": "preview-closed-store-smoke-0001"
              },
              body: JSON.stringify({
                customer_name: "Preview Smoke Test",
                customer_phone: "03001234567",
                delivery_address: "Preview test address",
                delivery_zone_id: "55555555-5555-4555-8555-555555555555",
                customer_language: "en",
                payment_method: "cod",
                notes: "",
                items: [{ product_id: "44444444-4444-4444-8444-444444444444", quantity: 1 }]
              })
            });
            assert.equal(checkoutResponse.status, 503, "Preview checkout remains closed");
            const checkoutBody = await checkoutResponse.json();
            assert.equal(checkoutBody.error, "store_not_accepting_orders", "Preview closed-store response");

            const sessionResponse = await requestWithRetry(`${admin}/api/v1/admin/session`, {
              headers: { Origin: admin }
            });
            assert.equal(sessionResponse.status, 401, "Admin session remains unauthenticated before owner bootstrap");
            const sessionBody = await sessionResponse.json();
            assert.equal(sessionBody.authenticated, false, "Admin session reports unauthenticated");

            await appShell("Customer", customer);
            await appShell("Admin", admin);

            console.log("Preview smoke tests passed: API health, D1 schema, customer/admin API forwarding, exact CORS, empty catalogue/categories, setup/readiness/payment flags, closed-store checkout, unauthenticated admin guard and both React shells.");
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
