name: FRYZAR Preview Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fryzar-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy isolated preview Workers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the selected GitHub commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate API, Worker routes and web builds
        run: |
          npm test
          npm run build:storefront
          npm run build:admin

      - name: Apply GitHub migrations to preview D1 only
        run: npm run db:migrate:preview

      - name: Deploy isolated API Worker
        run: npm run deploy:api-preview

      - name: Deploy customer preview Worker
        run: npx wrangler deploy --config apps/customer-worker/wrangler.toml

      - name: Deploy admin preview Worker
        run: npx wrangler deploy --config apps/admin-worker/wrangler.toml
