name: FRYZAR Preview Deployment

# Controlled manual deployment workflow for isolated preview Workers and preview D1 only.
# Never targets fryzar-production, fryzar-core, fryzar-api, fryzar-app, fryzar-admin, or fryzar.com.
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Reviewed branch or commit SHA to deploy to isolated preview"
        required: false
        default: "release/fryzar-production-ready"
        type: string

permissions:
  contents: read

concurrency:
  group: fryzar-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy and smoke-test isolated preview Workers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || 'release/fryzar-production-ready' }}
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate preview-only credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRACKING_SECRET: ${{ secrets.TRACKING_SECRET }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "234b20e49261c7a002f63b129e985563" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or does not match the FRYZAR Cloudflare account."
            exit 1
          fi

          for secret_name in CLOUDFLARE_API_TOKEN TRACKING_SECRET OWNER_BOOTSTRAP_TOKEN; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required preview environment secret is missing: $secret_name"
              exit 1
            fi
          done

          if [[ "${#TRACKING_SECRET}" -lt 32 ]]; then
            echo "::error::TRACKING_SECRET must contain at least 32 characters."
            exit 1
          fi

          if [[ "${#OWNER_BOOTSTRAP_TOKEN}" -lt 32 ]]; then
            echo "::error::OWNER_BOOTSTRAP_TOKEN must contain at least 32 characters."
            exit 1
          fi

      - name: Install candidate dependencies deterministically
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Cloudflare authentication
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Verify deployment targets are strictly preview-only
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:config-safety

          grep -Fqx 'name = "fryzar-api-preview"' apps/api/wrangler.toml
          grep -Fqx 'database_name = "fryzar-preview"' apps/api/wrangler.toml
          grep -Fqx 'database_id = "a6f528a3-4b36-43a9-8e77-31f7105a4aeb"' apps/api/wrangler.toml
          grep -Fqx 'name = "fryzar-app-preview"' apps/customer-worker/wrangler.toml
          grep -Fqx 'name = "fryzar-admin-preview"' apps/admin-worker/wrangler.toml
          grep -Fqx 'service = "fryzar-api-preview"' apps/customer-worker/wrangler.toml
          grep -Fqx 'service = "fryzar-api-preview"' apps/admin-worker/wrangler.toml

          if grep -Eq 'name = "fryzar-(app|admin|api)"|database_name = "fryzar-(production|core)"|database_id = "(880b9681-4252-4db0-be44-b60c4edbdc15|098238a6-1bda-4735-8f21-d925c7fe32de)"' \
            apps/api/wrangler.toml apps/customer-worker/wrangler.toml apps/admin-worker/wrangler.toml; then
            echo "::error::A production FRYZAR deployment target was detected. Aborting."
            exit 1
          fi

      - name: Run typechecks, unit tests, D1 integration tests, and frontend builds
        working-directory: candidate
        run: |
          npm run typecheck
          npm test
          npm run test:integration:migrations
          npm run test:integration:local
          npm run build

      - name: Apply migrations to isolated preview D1 only
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:preview

      - name: Bootstrap isolated central API Worker
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:api-preview

      - name: Provision preview-only API secrets
        working-directory: candidate
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRACKING_SECRET: ${{ secrets.TRACKING_SECRET }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TRACKING_SECRET" | npx wrangler secret put TRACKING_SECRET --config apps/api/wrangler.toml
          printf '%s' "$OWNER_BOOTSTRAP_TOKEN" | npx wrangler secret put OWNER_BOOTSTRAP_TOKEN --config apps/api/wrangler.toml

      - name: Deploy isolated central API Worker with secrets attached
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:api-preview

      - name: Deploy customer preview Worker
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config apps/customer-worker/wrangler.toml

      - name: Deploy admin preview Worker
        working-directory: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config apps/admin-worker/wrangler.toml

      - name: Smoke-test preview API, CORS, SEO endpoints, security headers, and service bindings
        shell: bash
        env:
          API_BASE_URL: https://fryzar-api-preview.perfectlooparts786.workers.dev
          CUSTOMER_BASE_URL: https://fryzar-app-preview.perfectlooparts786.workers.dev
          ADMIN_BASE_URL: https://fryzar-admin-preview.perfectlooparts786.workers.dev
        run: |
          set -euo pipefail

          node <<'NODE'
          const assert = require("node:assert/strict");

          const api = process.env.API_BASE_URL;
          const customer = process.env.CUSTOMER_BASE_URL;
          const admin = process.env.ADMIN_BASE_URL;

          async function requestWithRetry(url, options = {}) {
            let lastError;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try {
                const response = await fetch(url, options);
                if (response.status < 500) return response;
                lastError = new Error(`HTTP ${response.status} from ${url}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError || new Error(`Request failed: ${url}`);
          }

          async function health(label, baseUrl, origin) {
            const headers = origin ? { Origin: origin } : {};
            const response = await requestWithRetry(`${baseUrl}/api/v1/health`, { headers });
            assert.equal(response.status, 200, `${label} health status`);
            const body = await response.json();
            assert.equal(body.ok, true, `${label} API health`);
            assert.equal(body.schema, "ready", `${label} D1 schema`);
            if (origin) {
              assert.equal(
                response.headers.get("access-control-allow-origin"),
                origin,
                `${label} exact CORS origin`
              );
            }
          }

          async function appShell(label, baseUrl, expectNoIndex = false) {
            const response = await requestWithRetry(`${baseUrl}/`);
            assert.equal(response.status, 200, `${label} home page status`);
            assert.equal(response.headers.get("x-content-type-options"), "nosniff", `${label} nosniff header`);
            assert.equal(response.headers.get("x-frame-options"), "DENY", `${label} frame header`);
            if (expectNoIndex) {
              assert.match(response.headers.get("x-robots-tag") || "", /noindex/, `${label} noindex header`);
            }
            const html = await response.text();
            assert.ok(html.includes('id="root"'), `${label} React application shell`);
          }

          (async () => {
            await health("Direct API", api);
            await health("Customer service binding", customer, customer);
            await health("Admin service binding", admin, admin);

            const sitemapResponse = await requestWithRetry(`${customer}/sitemap.xml`);
            assert.equal(sitemapResponse.status, 200, "Customer sitemap.xml status");
            assert.match(sitemapResponse.headers.get("content-type") || "", /application\/xml/, "Customer sitemap XML");

            const robotsResponse = await requestWithRetry(`${customer}/robots.txt`);
            assert.equal(robotsResponse.status, 200, "Customer robots.txt status");
            const robotsText = await robotsResponse.text();
            assert.match(robotsText, /Disallow: \//, "Preview robots.txt disallows public indexing");

            const adConfigResponse = await requestWithRetry(`${customer}/api/v1/monetization-config`, {
              headers: { Origin: customer }
            });
            assert.equal(adConfigResponse.status, 200, "Monetization config status");
            const adBody = await adConfigResponse.json();
            assert.equal(adBody.monetization.effectiveActive, false, "Ads remain safely disabled by default");

            const settingsResponse = await requestWithRetry(`${customer}/api/v1/storefront-config`, {
              headers: { Origin: customer }
            });
            assert.equal(settingsResponse.status, 200, "Public storefront settings route");
            const settingsBody = await settingsResponse.json();
            assert.equal(settingsBody.settings.store_status, "setup", "Preview store remains in setup");
            assert.equal(settingsBody.settings.launch_ready, false, "Preview ordering remains closed");
            assert.equal(settingsBody.settings.manual_transfer_enabled, false, "Manual transfer remains disabled");
            assert.equal(settingsBody.settings.currency, "PKR", "Preview currency");

            const sessionResponse = await requestWithRetry(`${admin}/api/v1/admin/session`, {
              headers: { Origin: admin }
            });
            assert.equal(sessionResponse.status, 401, "Admin session remains unauthenticated before login");

            await appShell("Customer", customer, false);
            await appShell("Admin", admin, true);

            console.log("Preview smoke tests passed: API health, 9-migration D1 schema, SEO endpoints, ad safety defaults, security headers, closed-store setup state, unauthenticated admin guard, and both React shells.");
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
