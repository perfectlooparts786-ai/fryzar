name: FRYZAR CI

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate API, Worker routing, and web builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate and verify lockfile candidate
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload lockfile candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/foundation/fresh-build'
        uses: actions/upload-artifact@v4
        with:
          name: fryzar-package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Emit temporary lockfile candidate for review
        if: github.event_name == 'push' && github.ref == 'refs/heads/foundation/fresh-build'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const value = fs.readFileSync("package-lock.json").toString("base64");
          const chunkSize = 2400;
          const total = Math.ceil(value.length / chunkSize);
          for (let index = 0; index < total; index += 1) {
            const part = value.slice(index * chunkSize, (index + 1) * chunkSize);
            console.log("FRYZAR_LOCKFILE_CHUNK_" + String(index).padStart(3, "0") + "_OF_" + String(total).padStart(3, "0") + ":" + part);
          }
          NODE

      - name: Validate API and Worker routing tests
        run: npm test

      - name: Validate checkout transactions against local D1
        run: npm run test:integration:local
      - name: Validate cancellation transitions against local D1
        run: npm run test:integration:cancellation

      - name: Validate owner bootstrap against local D1
        run: npm run test:integration:bootstrap

      - name: Validate staff session lifecycle against local D1
        run: npm run test:integration:session

      - name: Validate populated financial integrity against local D1
        run: npm run test:integration:financial

      - name: Validate bounded retention cleanup against local D1
        run: npm run test:integration:retention

      - name: Build customer storefront
        run: npm run build:storefront

      - name: Build admin portal
        run: npm run build:admin

      - name: Validate API preview Worker bundle
        run: npx wrangler deploy --dry-run --config apps/api/wrangler.toml

      - name: Validate customer preview Worker and static assets
        run: npx wrangler deploy --dry-run --config apps/customer-worker/wrangler.toml

      - name: Validate admin preview Worker and static assets
        run: npx wrangler deploy --dry-run --config apps/admin-worker/wrangler.toml
