# Explicit PRODUCTION configuration for fryzar-admin (admin operations portal).
# PROTECTED: Do NOT deploy without explicit owner cutover authorization.
name = "fryzar-admin"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

routes = [
  { pattern = "admin.fryzar.com", custom_domain = true }
]

[assets]
directory = "../../dist/admin"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[services]]
binding = "API"
service = "fryzar-api"
